<!DOCTYPE html>
<html>
<head>
    <title>Chat - CryptChat</title>
</head>

<body>

    <h1>Chat with {{ user.username }}</h1>

    <div>
        {% if messages %}

            {% for message in messages %}

                <p>
                    {% if message.sender_id == session["user_id"] %}
                        <strong>You:</strong>
                    {% else %}
                        <strong>{{ user.username }}:</strong>
                    {% endif %}

                    {{ message.text }}
                </p>

            {% endfor %}

        {% else %}

            <p>No messages yet.</p>

        {% endif %}
    </div>

    <br>

        <form method="POST" action="{{ url_for('auth.send_message', user_id=user.id) }}">

        <textarea
            name="message"
            placeholder="Type a message..."
            maxlength="2000"
            required
        ></textarea>

        <br><br>

        <button type="submit">Send</button>

    </form>

    <br>

    <a href="{{ url_for('auth.connections') }}">Back to Connections</a>

</body>
</html>
