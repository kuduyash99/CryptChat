<!DOCTYPE html>
<html>
<head>
    <title>Search Users - CryptChat</title>
</head>

<body>

    <h1>Search Users</h1>

    <form method="GET">
        <input
            type="text"
            name="username"
            placeholder="Search username"
            value="{{ query }}"
            required
        >

        <button type="submit">Search</button>
    </form>

    <br>

    {% if query %}

        {% if users %}
            <h3>Results:</h3>

            {% for user in users %}
                <div>
                    <strong>{{ user.username }}</strong>

                    <form
                        method="POST"
                        action="{{ url_for('auth.send_connection_request', user_id=user.id) }}"
                        style="display: inline;"
                    >
                        <button type="submit">Send Connection Request</button>
                    </form>

                    <form
                        method="POST"
                        action="{{ url_for('auth.block_user', user_id=user.id) }}"
                        style="display: inline;"
                    >
                        <button type="submit">Block</button>
                    </form>
                </div>

                <br>
            {% endfor %}

        {% else %}
            <p>No users found.</p>
        {% endif %}

    {% endif %}

    <br>

    <a href="{{ url_for('auth.logout') }}">Logout</a>

</body>
</html>
